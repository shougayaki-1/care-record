name: Playwright Tests
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Apply Supabase migrations (e2e)
    environment: e2e
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate e2e migration configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"
      - name: Link the exact target project
        run: npx --yes supabase@2.108.0 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Show migration status
        run: npx --yes supabase@2.108.0 migration list --linked
      - name: Preview pending migrations
        run: npx --yes supabase@2.108.0 db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending migrations
        run: npx --yes supabase@2.108.0 db push --linked --password "$SUPABASE_DB_PASSWORD"

  test:
    name: Dedicated environment E2E
    needs: migrate
    environment: e2e
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AI_IMPORT_ENABLED: 'false'
      E2E_TEST_ENV: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Build application
      run: npm run build
      env:
        # 型チェックワーカーがデフォルトの約2GBヒープでOOMになるため拡張する
        NODE_OPTIONS: --max-old-space-size=6144
    - name: Start application
      run: |
        npm run start > /tmp/care-record-e2e.log 2>&1 &
        for _ in {1..60}; do
          if curl --fail --silent http://localhost:3000 > /dev/null; then
            exit 0
          fi
          sleep 2
        done
        cat /tmp/care-record-e2e.log
        exit 1
    - name: Run Playwright tests
      run: npm run test:e2e -- --project=chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
