name: Security assurance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * 1'

permissions:
  contents: read

jobs:
  application-security:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AI_IMPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block high/critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        if: ${{ always() }}
        # package-lock-only avoids platform-specific optional dependency gaps while
        # retaining a deterministic production dependency inventory.
        run: npm sbom --package-lock-only --omit=dev --sbom-format=cyclonedx > care-record-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sbom-${{ github.sha }}
          path: care-record-sbom.cdx.json
          retention-days: 90

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
