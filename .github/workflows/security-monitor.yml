name: Security monitoring

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: Send an additional synthetic delivery probe (both enabled environments)
        type: boolean
        default: false
      firewall_diagnostic:
        description: Check read-only Firewall sources in production without starting monitoring
        type: boolean
        default: false
      verify_staging:
        description: Run synthetic DB/Discord verification in Staging only (requires an explicitly allowed branch)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  monitor:
    if: inputs.verify_staging != true && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.SECURITY_MONITOR_SCHEDULE_ENABLED == 'true')
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ matrix.environment }}
    concurrency:
      group: security-monitor-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pinned read-only Firewall CLI
        if: vars.SECURITY_MONITOR_ENABLED == 'true' && vars.SECURITY_FIREWALL_ENABLED == 'true'
        run: npm install --prefix "${RUNNER_TEMP}/security-vercel" --ignore-scripts --no-audit --no-fund vercel@65.2.0
      - name: Collect Auth aggregate (isolated scoped token)
        if: vars.SECURITY_MONITOR_ENABLED == 'true' && vars.SECURITY_AUTH_LOGS_ENABLED == 'true'
        env:
          APP_ENV: ${{ matrix.environment }}
          SECURITY_MONITOR_PROJECT_REF: ${{ vars.SECURITY_MONITOR_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SECURITY_LOGS_TOKEN }}
          AUTH_LOGS_RESULT_FILE: ${{ runner.temp }}/security-auth-count.json
        run: node scripts/security/auth-logs.mjs
      - name: Collect counts and deliver pending alerts
        if: vars.SECURITY_MONITOR_ENABLED == 'true'
        env:
          APP_ENV: ${{ matrix.environment }}
          PGHOST: ${{ vars.SECURITY_MONITOR_PGHOST }}
          PGPORT: ${{ vars.SECURITY_MONITOR_PGPORT || '5432' }}
          PGDATABASE: postgres
          PGUSER: ${{ vars.SECURITY_MONITOR_PGUSER }}
          SECURITY_MONITOR_PROJECT_REF: ${{ vars.SECURITY_MONITOR_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SECURITY_MONITOR_PGPASSWORD }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/security-monitor-ca.crt
          PGCONNECT_TIMEOUT: '10'
          MONITOR_CA: ${{ secrets.SECURITY_MONITOR_CA_CERT }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_SECURITY_WEBHOOK_URL || secrets.DISCORD_ALERT_WEBHOOK_URL }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SECURITY_MONITOR_PROBE: ${{ inputs.probe || 'false' }}
          SECURITY_FIREWALL_ENABLED: ${{ vars.SECURITY_FIREWALL_ENABLED || 'false' }}
          SECURITY_AUTH_LOGS_ENABLED: ${{ vars.SECURITY_AUTH_LOGS_ENABLED || 'false' }}
          AUTH_LOGS_RESULT_FILE: ${{ runner.temp }}/security-auth-count.json
          VERCEL_SECURITY_CLI: ${{ runner.temp }}/security-vercel/node_modules/.bin/vercel
          VERCEL_TOKEN: ${{ secrets.VERCEL_SECURITY_READ_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$MONITOR_CA" > "$PGSSLROOTCERT"
          node scripts/security/monitor.mjs
      - name: Explicitly report inactive monitoring
        if: vars.SECURITY_MONITOR_ENABLED != 'true'
        run: echo 'security_monitor_disabled — no source observations or delivery guarantees' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary TLS CA
        if: always()
        run: rm -f "${RUNNER_TEMP}/security-monitor-ca.crt" "${RUNNER_TEMP}/security-auth-count.json"

  verify-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_staging == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: security-monitor-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify synthetic spike, suppression, recovery and durable retry
        env:
          APP_ENV: staging
          PGHOST: ${{ vars.SECURITY_MONITOR_PGHOST }}
          PGPORT: ${{ vars.SECURITY_MONITOR_PGPORT || '5432' }}
          PGDATABASE: postgres
          PGUSER: ${{ vars.SECURITY_MONITOR_PGUSER }}
          SECURITY_MONITOR_PROJECT_REF: ${{ vars.SECURITY_MONITOR_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SECURITY_MONITOR_PGPASSWORD }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/security-monitor-ca.crt
          PGCONNECT_TIMEOUT: '10'
          MONITOR_CA: ${{ secrets.SECURITY_MONITOR_CA_CERT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          umask 077
          printf '%s\n' "$MONITOR_CA" > "$PGSSLROOTCERT"
          node scripts/security/verify-staging.mjs
      - name: Remove temporary TLS CA
        if: always()
        run: rm -f "${RUNNER_TEMP}/security-monitor-ca.crt"

  firewall-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.firewall_diagnostic == true && github.ref == 'refs/heads/codex/issue-160-firewall-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pinned Vercel CLI
        run: npm install --prefix "${RUNNER_TEMP}/security-vercel" --ignore-scripts --no-audit --no-fund vercel@65.2.0
      - name: Check read-only aggregate availability
        env:
          VERCEL_SECURITY_CLI: ${{ runner.temp }}/security-vercel/node_modules/.bin/vercel
          VERCEL_TOKEN: ${{ secrets.VERCEL_SECURITY_READ_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { collectFirewall } from './scripts/security/firewall.mjs';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          const run = promisify(execFile);
          const categories = {};
          const runner = async args => {
            try {
              const { stdout } = await run(process.env.VERCEL_SECURITY_CLI, args, { timeout: 45000, maxBuffer: 262144 });
              return JSON.parse(stdout);
            } catch (e) {
              const data = String(e.stderr || '');
              categories[args[1]] = {
                permissionDenied: /403|forbidden|not authorized|permission|access denied/i.test(data),
                exitCode: typeof e.code === 'number' ? e.code : null,
                parseError: e instanceof SyntaxError,
                stderrPresent: data.length > 0,
                mentionsToken: /token/i.test(data),
                mentionsValid: /valid/i.test(data),
                mentionsAuthentication: /auth|login|log in/i.test(data),
                markers: ['error','failed','invalid','expired','credential','project','team','account','access','scope','not','forbidden','required','unknown','unavailable','version','request','fetch','json','npm','client','network','format','syntax','options','flag','403','404','401','429','endpoint','api','non-interactive','internal','install','module','unsupported'].filter(word => data.toLowerCase().includes(word)),
                invalidToken: /invalid token|not authenticated|log in|login required|unauthorized|401/i.test(data),
                projectOrTeamScope: /project.scoped|team.scope|scope|team not found|project not found/i.test(data),
                timedOut: e.killed === true,
              };
              throw new Error('source_unavailable');
            }
          };
          let projectStatus = null;
          try {
            const response = await fetch('https://api.vercel.com/v9/projects/prj_hM6VAEcC8T773hF48MSRHtkLKyl2', {
              headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` }, redirect: 'error', signal: AbortSignal.timeout(10000),
            });
            projectStatus = response.status;
          } catch {}
          const result = await collectFirewall({ environment: 'production', enabled: true, runner });
          const headers = { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` };
          const getStatus = async path => {
            try { return (await fetch(`https://api.vercel.com${path}`, { headers, redirect: 'error', signal: AbortSignal.timeout(10000) })).status; }
            catch { return null; }
          };
          const teamStatus = await getStatus('/v2/teams/team_ysW0wFQFYn4lGeDbqSnJtdDc');
          const userStatus = await getStatus('/v2/user');
          const withoutScope = async args => {
            const i = args.indexOf('--scope');
            if (i >= 0) args = [...args.slice(0, i), ...args.slice(i + 2)];
            return runner(args);
          };
          const direct = await collectFirewall({ environment: 'production', enabled: true, runner: withoutScope });
          const end = new Date(); const start = new Date(end.getTime() - 15 * 60 * 1000);
          const owner = 'team_ysW0wFQFYn4lGeDbqSnJtdDc'; const project = 'prj_hM6VAEcC8T773hF48MSRHtkLKyl2';
          const base = `https://api.vercel.com/metrics/v1?teamId=${owner}`;
          let metricsStatus = null;
          try {
            const response = await fetch(base, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, redirect: 'error', signal: AbortSignal.timeout(20000), body: JSON.stringify({ scope: { ownerId: owner, projectIds: [project] }, timeRange: { start: start.toISOString(), end: end.toISOString() }, metrics: { value: { metric: 'vercel.firewall_action.count', aggregation: 'count' } }, outputs: ['value'], groupBy: ['wafAction'], rowLimit: 100 }) });
            metricsStatus = response.status; await response.body?.cancel();
          } catch {}
          let attackStatus = null, attackCount = null;
          try {
            const response = await fetch(`https://api.vercel.com/v1/security/firewall/attack-status?projectId=${project}&teamId=${owner}&since=1`, { headers, redirect: 'error', signal: AbortSignal.timeout(10000) });
            attackStatus = response.status;
            if (response.ok) { const body = await response.json(); if (Array.isArray(body.anomalies)) attackCount = body.anomalies.length; }
          } catch {}

          const alertsStatus = await getStatus(`/alerts/v3/groups?projectId=${project}&teamId=${owner}&from=${encodeURIComponent(start.toISOString())}&to=${encodeURIComponent(end.toISOString())}&limit=200&types=botId_anomaly&types=firewallSystemRule_anomaly&types=firewallCustomRule_anomaly`);
          console.log(JSON.stringify({ projectStatus, teamStatus, userStatus, metricsStatus, attackStatus, attackCount, alertsStatus, withoutScope: { trafficAvailable: direct.traffic !== null, alertsAvailable: direct.alerts !== null } }));
          console.log(JSON.stringify({ credentialPresent: !!process.env.VERCEL_TOKEN, projectTokenFormat: /^vcp_/.test(process.env.VERCEL_TOKEN || ''), status: result.status, trafficAvailable: result.traffic !== null, alertsAvailable: result.alerts !== null, categories }));
          JS
