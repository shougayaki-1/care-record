name: Backup freshness

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to inspect
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: backup-freshness-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      APP_ENV: ${{ github.event.inputs.environment || 'production' }}
      GCS_BACKUP_BUCKET: ${{ vars.GCS_BACKUP_BUCKET }}
      GCS_REPLICA_BUCKET: ${{ vars.GCS_REPLICA_BUCKET }}
      DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
      EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: scripts/backup/check-backup-freshness.sh
