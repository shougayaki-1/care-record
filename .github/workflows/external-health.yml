name: External health monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to monitor
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: external-health-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      APP_ENV: ${{ github.event.inputs.environment || 'production' }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
      EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Probe the non-PII health endpoint
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          : "${HEALTHCHECK_URL:?HEALTHCHECK_URL is required}"
          endpoint="${HEALTHCHECK_URL%/}/api/health"
          curl_args=(--silent --output health-response.json --write-out '%{http_code}'
            --connect-timeout 10 --max-time 20 --max-filesize 16384
            --retry 2 --retry-all-errors --retry-max-time 45)
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            curl_args+=(--header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          # Do not follow redirects while sending the bypass header.
          curl_status=0
          status="$(curl "${curl_args[@]}" "$endpoint")" || curl_status=$?
          if [[ "$curl_status" -ne 0 ]]; then
            echo "Health probe request failed (curl exit $curl_status; HTTP ${status:-000})." >&2
            exit "$curl_status"
          fi
          if [[ "$status" != '200' ]]; then
            echo "Health endpoint returned HTTP $status." >&2
            exit 1
          fi
          if ! jq -e '.ok == true and .service == "care-record" and
            (.database.capacity | IN("normal", "warning", "restricted", "critical"))' \
            health-response.json >/dev/null 2>&1; then
            echo 'Health endpoint returned an invalid or unhealthy payload.' >&2
            exit 1
          fi
      - name: Notify when database capacity crosses a threshold
        shell: bash
        run: |
          set -euo pipefail
          level="$(jq -r '.database.capacity' health-response.json)"
          case "$level" in
            normal) exit 0 ;;
            warning) severity='Warning' ;;
            restricted) severity='High' ;;
            critical) severity='Critical' ;;
            *) exit 1 ;;
          esac
          scripts/backup/notify-discord.sh "$severity" "database_capacity_${level}" "$EVIDENCE_URL"
      - name: Notify when the external probe fails
        if: ${{ failure() }}
        run: scripts/backup/notify-discord.sh Critical external_health_failed "$EVIDENCE_URL"
