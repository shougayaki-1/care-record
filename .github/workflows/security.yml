name: Security assurance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * 1'

permissions:
  contents: read

jobs:
  application-security:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run lint
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Block high/critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > care-record-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: care-record-sbom.cdx.json
          retention-days: 90

  secret-scan:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
