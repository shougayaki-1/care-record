name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 1'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  AI_IMPORT_ENABLED: 'false'
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key

jobs:
  scope:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      database: ${{ steps.changes.outputs.database }}
      databaseUpgrade: ${{ steps.changes.outputs.databaseUpgrade }}
      ui: ${{ steps.changes.outputs.ui }}
      e2eCritical: ${{ steps.changes.outputs.e2eCritical }}
      e2eAll: ${{ steps.changes.outputs.e2eAll }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
      secretScan: ${{ steps.changes.outputs.secretScan }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Select checks from changed files
        id: changes
        run: node scripts/ci/classify-changes.mjs

  quality:
    name: App checks
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run security:service-role
      - run: npm run test:ci-scope
      - run: npm run test:unit
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  database:
    name: Empty database migrations and pgTAP
    needs: scope
    if: needs.scope.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - name: Start local Supabase and apply every migration
        run: supabase start
      - name: Rebuild from an empty database
        run: supabase db reset
      - name: Verify generated database types are current
        run: |
          node scripts/db/generate-types-local.mjs > /tmp/database.generated.ts
          diff -u src/types/database.generated.ts /tmp/database.generated.ts
      - name: Run database security tests
        run: supabase test db
      - name: Lint database functions and schema
        run: supabase db lint --local --level warning --fail-on warning
      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop --no-backup

  database-upgrade:
    name: Existing database migration upgrade
    needs: scope
    if: needs.scope.outputs.databaseUpgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - name: Resolve the previous release baseline
        env:
          PREVIOUS_RELEASE_REF: ${{ vars.PREVIOUS_RELEASE_REF }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          candidate_sha="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [[ -z "$candidate_sha" || "$candidate_sha" =~ ^0+$ ]]; then
            candidate_sha="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${candidate_sha}^{commit}"

          if [[ -n "$PREVIOUS_RELEASE_REF" ]]; then
            baseline_sha="$(git rev-parse "${PREVIOUS_RELEASE_REF}^{commit}")"
          else
            baseline_sha="$(git describe --tags --abbrev=0 "$candidate_sha" 2>/dev/null || true)"
            baseline_sha="${baseline_sha:-$candidate_sha}"
          fi
          git cat-file -e "${baseline_sha}^{commit}"
          echo "BASELINE_SHA=$baseline_sha" >> "$GITHUB_ENV"
      - name: Build the previous release database
        run: |
          git worktree add --detach /tmp/care-record-baseline "$BASELINE_SHA"
          supabase start --workdir /tmp/care-record-baseline
          supabase db reset --workdir /tmp/care-record-baseline
      - name: Stage only newly added migrations
        run: |
          changed_migrations="$(git diff --name-status "$BASELINE_SHA" HEAD -- 'supabase/migrations/*.sql')"
          invalid_changes="$(printf '%s\n' "$changed_migrations" | awk 'NF && $1 != "A"')"
          if [[ -n "$invalid_changes" ]]; then
            echo "Existing migrations must not be modified or deleted:"
            echo "$invalid_changes"
            exit 1
          fi
          printf '%s\n' "$changed_migrations" | awk '$1 == "A" { print $2 }' | while IFS= read -r migration; do
            [[ -z "$migration" ]] && continue
            cp "$migration" "/tmp/care-record-baseline/$migration"
          done
      - name: Apply the release migration delta
        run: supabase migration up --local --workdir /tmp/care-record-baseline
      - name: Run current pgTAP contracts against the upgraded database
        run: supabase test db "$GITHUB_WORKSPACE/supabase/tests" --local --workdir /tmp/care-record-baseline
      - name: Lint the upgraded database
        run: supabase db lint --local --level warning --fail-on warning --workdir /tmp/care-record-baseline
      - name: Stop upgrade-test Supabase
        if: ${{ always() }}
        run: supabase stop --no-backup --workdir /tmp/care-record-baseline

  ui:
    name: Storybook UI tests
    needs: scope
    if: needs.scope.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  e2e:
    name: Local Supabase E2E
    needs: scope
    if: needs.scope.outputs.e2eCritical == 'true' || needs.scope.outputs.e2eAll == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the selected local E2E suite
        env:
          E2E_ALL: ${{ needs.scope.outputs.e2eAll }}
        run: |
          if [[ "$E2E_ALL" == 'true' ]]; then
            npm run test:e2e
          else
            npm run test:e2e:critical
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    name: Dependency audit and SBOM
    needs: scope
    if: needs.scope.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - name: Generate CycloneDX SBOM
        if: ${{ always() }}
        run: npm run --silent security:sbom > care-record-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sbom-${{ github.sha }}
          path: care-record-sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 90

  secret-scan:
    name: Secret scan
    needs: scope
    if: needs.scope.outputs.secretScan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  final:
    name: CI
    needs: [scope, quality, database, database-upgrade, ui, e2e, dependencies, secret-scan]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .scope.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")
            and (.scope.outputs.core != "true" or .quality.result == "success")
            and (.scope.outputs.database != "true" or .database.result == "success")
            and (.scope.outputs.databaseUpgrade != "true" or .["database-upgrade"].result == "success")
            and (.scope.outputs.ui != "true" or .ui.result == "success")
            and ((.scope.outputs.e2eCritical != "true" and .scope.outputs.e2eAll != "true") or .e2e.result == "success")
            and (.scope.outputs.dependencies != "true" or .dependencies.result == "success")
            and (.scope.outputs.secretScan != "true" or .["secret-scan"].result == "success")
          '
